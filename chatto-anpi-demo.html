function newId(){if(!globalThis.crypto?.getRandomValues)throw Error('random');return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');}
function openEditor(r){if(privacy){if(!confirm(t('confirmReveal')))return;privacy=false;updatePrivacy();}if(!storageOK||!ready)return;const fresh=!r;let id;try{id=r?.id||newId();}catch{alertMsg('required');return;}edit={id,fresh,base:r||{heads:Object.fromEntries(E.fields.map(k=>[k,[]]))}};$('editorActor').value=state.actor||host?.selfName||'';translated($('editTitle'),fresh?'registration':'edit');$('fields').replaceChildren();for(const [k,label]of Object.entries(labels)){const l=ui('label',label),inp=document.createElement(['status','safety'].includes(k)?'select':['support','note'].includes(k)?'textarea':'input');inp.id='f-'+k;inp.maxLength=['support','note'].includes(k)?1000:150;if(['status','safety'].includes(k))for(const s of k==='status'?statuses:safetyOptions){const o=new Option(I.value(s),s);o.dataset.i18n=I.keyFor(s);inp.append(o);}inp.value=r?.[k]||(['status','safety'].includes(k)?'未確認':'');if(k==='name')inp.required=true;l.append(inp);$('fields').append(l);const c=el('div');conflictBox(c,r?.heads[k]||[],k);$('fields').append(c);if((r?.heads[k].length||0)>1){const l=el('label'),cb=document.createElement('input');cb.type='checkbox';cb.id='resolve-'+k;l.append(cb,ui('span','resolveField'));$('fields').append(l);}}$('safetyButtons').replaceChildren();for(const v of safetyOptions){const b=ui('button',I.keyFor(v),{},safetyClass(v));b.type='button';b.dataset.value=v;b.setAttribute('aria-pressed',String(v===$('f-safety').value));b.onclick=()=>{$('f-safety').value=v;$('f-safety').onchange();};$('safetyButtons').append(b);}$('f-safety').onchange=()=>document.querySelectorAll('#safetyButtons button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===$('f-safety').value)));fillAssessment(r?.assessment||'');edit.initialAssessment=JSON.stringify(Object.fromEntries(assessmentKeys.map(k=>[k,$(k).value])));$('resolveAssessment').checked=false;conflictBox($('assessmentConflict'),r?.heads.assessment||[],'assessment');show('editor');}
$('form').onsubmit=e=>{e.preventDefault();if(!edit||!storageOK||!ready)return;const actor=$('editorActor').value.trim();if(!actor||!$('f-name').value.trim()){alertMsg('required');return;}const changes={};for(const k of Object.keys(labels)){const value=$('f-'+k).value.trim(),base=edit.base[k]||'',heads=edit.base.heads[k];if((edit.fresh&&value)||(!edit.fresh&&(value!==base||$('resolve-'+k)?.checked))){if(heads.length>1&&!$('resolve-'+k)?.checked){alertMsg('required');return;}changes[k]={value,parents:heads.map(h=>h.id)};}}const a=Object.fromEntries(assessmentKeys.map(k=>[k,$(k).value.trim()])),av=JSON.stringify(a);if(av!==edit.initialAssessment||$('resolveAssessment').checked){if(edit.base.heads.assessment.length>1&&!$('resolveAssessment').checked){alertMsg('required');return;}if((a.obs||a.triage||a.care||a.tag)&&(!a.assessor||!a.observed)){alertMsg('observationRequired');return;}if(a.observed&&!Number.isFinite(new Date(a.observed).getTime())){alertMsg('observationRequired');return;}changes.assessment={value:av,parents:edit.base.heads.assessment.map(h=>h.id)};}if(!Object.keys(changes).length){alertMsg('noEdits');return;}let event;try{event={v:1,id:newId(),person:edit.id,actor,at:new Date().toISOString(),changes};}catch{alertMsg('required');return;}if(!E.valid(event)){alertMsg('required');return;}if(!persist({...state,actor,events:{...state.events,[event.id]:event},pending:[...state.pending,event.id]}))return;edit=null;$('actor').value=actor;show('list');alertMsg(window.ANPI_DEMO?'demoSaved':'savedMessage');pump();};
async function pump(){if(!host||!ready||sending||!state.pending.length||!storageOK)return;const interval=Math.max(10000,Number(host.sendUpdateInterval)||10000);if(Date.now()-lastSend<interval)return;const events=[],max=Math.min(100000,Number(host.sendUpdateMaxSize)||128000);for(const id of state.pending){const candidate=[...events,state.events[id]];if(new TextEncoder().encode(JSON.stringify({payload:{app:'chatto-anpi',v:1,events:candidate}})).length>max)break;events.push(state.events[id]);if(events.length>=15)break;}if(!events.length){alertMsg('sendError');return;}sending=true;lastSend=Date.now();try{await host.sendUpdate({payload:{app:'chatto-anpi',v:1,events}},'');}catch{alertMsg('sendError');}finally{sending=false;sync();}}
function receive(update){const p=update.payload;if(!p||p.app!=='chatto-anpi'||p.v!==1||!Array.isArray(p.events)||p.events.length>15)return;const next={...state,events:{...state.events},pending:[...state.pending]};let changed=false;for(const e of p.events){if(!E.valid(e)||['__proto__','constructor','prototype'].includes(e.id)){alertMsg('idError');continue;}if(Object.hasOwn(next.events,e.id)&&JSON.stringify(next.events[e.id])!==JSON.stringify(e)){alertMsg('idError');continue;}if(!Object.hasOwn(next.events,e.id)){next.events[e.id]=e;changed=true;}if(next.pending.includes(e.id)){next.pending=next.pending.filter(id=>id!==e.id);changed=true;}}if(changed){if(storageOK)persist(next);else state=next;}lastReceive=new Date().toISOString();render();if(edit&&p.events.some(e=>e?.person===edit.id))alertMsg('incoming');}

$('export').onclick=()=>{const all=records(),line=(k,n)=>t(k)+': '+I.number(n);$('report').value=[t('summaryTitle'),I.date(new Date()),...statuses.map(s=>line(I.keyFor(s),all.filter(r=>r.heads.status.length<=1&&(r.status||'未確認')===s).length)),line('statusConflict',all.filter(r=>r.heads.status.length>1).length),...safetyOptions.map(v=>line(I.keyFor(v),all.filter(r=>r.heads.safety.length<=1&&safety(r)===v).length)),line('safetyConflict',all.filter(r=>r.heads.safety.length>1).length),line('counts',all.length),line('pending',state.pending.length),t('summaryNote')].join('\n');$('report').hidden=false;$('share').hidden=!host?.sendToChat;};

function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
async function exportPeople(kind){if(!confirm(t('confirmExport')))return;const all=records();let text;if(kind==='json')text=JSON.stringify({app:'chatto-anpi',version:'1.0.0',exportedAt:new Date().toISOString(),notice:'Local snapshot: delayed delivery, duplicates and conflicts possible. No restore/import for this backup format.',records:all,events:Object.values(state.events),pending:state.pending},null,2);else{const keys=['id',...E.fields];text='\uFEFF'+[keys.map(csvCell).join(','),...all.map(r=>keys.map(k=>csvCell(k!=='id'&&r.heads[k]?.length>1?'[CONFLICT]'+JSON.stringify(r.heads[k]):k==='assessment'?r[k]:r[k])).join(','))].join('\r\n');}const name='chatto-anpi-'+new Date().toISOString().slice(0,10)+'.'+kind;if(host?.sendToChat){try{await host.sendToChat({file:{name,plainText:text},text:t('exportNotice')});}catch{alertMsg('exportError');}}else{const url=URL.createObjectURL(new Blob([text],{type:kind==='json'?'application/json':'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}}

function previewRoster(){clearImport();try{if(!storageOK||!ready)throw Error('storage');const content=$('importText').value;if(new TextEncoder().encode(content).length>20000000){alertMsg('fileSize');return;}const data=AnpiImport.parse(content);importPlan=AnpiImport.plan(data,records());const names=new Map();importPlan.forEach(p=>names.set(p.name,(names.get(p.name)||0)+1));importFormatKey={'JSONバックアップ':'formatJSON','世帯・状態CSV':'formatHousehold','入退場CSV':'formatCSV'}[data.format]||'formatCSV';updateImportSummary();importPlan.forEach((p,i)=>{if(names.get(p.name)>1&&!p.skip)p.warning+=' same-name';const n=el('article',undefined,'card'),l=el('label'),cb=document.createElement('input');cb.type='checkbox';cb.id='import-row-'+i;cb.disabled=p.skip;cb.checked=!p.skip&&!p.warning;l.append(cb,document.createTextNode(' '+p.name+' / '+p.sourceId));const details=ui('p','households');details.append(document.createTextNode(': '+(p.householdId||'—')+' / '),ui('span',{in:'present',return:'present',out:'unknown',outing:'outing',discharge:'departed'}[p.action]||'unknown'));n.append(l,details);if(p.warning)n.append(ui('p',p.skip?'importExisting':'importNameMatch',{},'warn'));$('importRows').append(n);});$('applyImport').disabled=!importPlan.some(p=>!p.skip);alertMsg('importReview');}catch{clearImport();alertMsg('importError');}}
